<figure [class]="classes" [style]="imageStyle">
  <img
    [src]="src"
    [alt]="alt"
    [style.object-position]="objectPosition || null"
    [attr.width]="width"
    [attr.height]="height"
    [attr.loading]="loading"
    [attr.fetchpriority]="fetchpriority"
    (load)="onLoad($event)"
  />
</figure>
