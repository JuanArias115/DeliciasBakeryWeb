<section class="container seasonal-section" aria-labelledby="seasonal-title">
  <div class="seasonal-banner">
    <div class="seasonal-copy">
      <p class="seasonal-label">Nuevo · Producto de temporada</p>
      <h2 id="seasonal-title">{{ product.name }}</h2>
      <p class="seasonal-description">{{ product.description }}</p>
      <p class="seasonal-price">
        <strong>{{ getMinPrice(product) | currency: 'COP' : 'symbol' : '1.0-0' }}</strong>
        <span>{{ getDefaultSize(product)?.serves }}</span>
      </p>
      <div class="seasonal-actions">
        <a class="seasonal-order" [href]="orderLink" target="_blank" rel="noopener noreferrer" (click)="trackOrder()">
          Pedir por WhatsApp
        </a>
        <a class="seasonal-detail" [routerLink]="['/productos', product.slug]" [attr.aria-label]="'Ver ' + product.name">Ver producto</a>
      </div>
      <small>Chía y Cajicá · Por encargo, con mínimo 24 horas de anticipación.</small>
    </div>
    <div class="seasonal-photo">
      <img [src]="product.images[0]" [alt]="product.name + ' con decoración de crema sobre fondo rosado'"
        width="720" height="1280" loading="eager" fetchpriority="high" />
    </div>
  </div>
</section>
